name: Collect public tour drafts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: tour-content-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Import tours
        run: python scripts/import_tours.py
      - name: Commit imported drafts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/.vitepress/content/tours/*.md
          if git diff --cached --quiet; then
            echo 'No tour draft changes to commit'
            exit 0
          fi
          git commit -m 'chore: collect public tour drafts'
          git push origin HEAD:main
