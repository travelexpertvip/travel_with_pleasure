name: Collect public tour drafts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: public-tour-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install -r requirements-tour-import.txt

      - name: Collect public Telegram posts
        run: python scripts/import_tours.py

      - name: Create or update review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/public-tour-drafts
          delete-branch: false
          commit-message: 'chore: collect public tour drafts'
          title: 'chore: review new public tour drafts'
          body: |
            Автоматически собранные черновики из публичных Telegram-каналов.

            Перед merge проверьте визу, страну, даты, отель, питание, цену и источник.
            Для публикации перенесите подтверждённые карточки из `docs/.vitepress/content/tour-drafts/` в `docs/.vitepress/content/tours/`.
          draft: true
