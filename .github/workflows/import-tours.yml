name: Collect public tour drafts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: public-tour-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install collector dependencies
        run: pip install -r requirements-tour-import.txt

      - name: Collect public Telegram posts
        run: python scripts/import_tours.py

      - name: Preserve reviewed cards and label new drafts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          tours = Path('docs/.vitepress/content/tours')
          changed = subprocess.run(
              ['git', 'diff', '--name-only'],
              check=True, text=True, capture_output=True
          ).stdout.splitlines()
          for name in changed:
              path = Path(name)
              if not str(path).startswith(str(tours)) or path.suffix != '.md':
                  continue
              base = subprocess.run(
                  ['git', 'show', f'HEAD:{name}'], text=True, capture_output=True
              )
              if base.returncode == 0 and re.search(
                  r'(?m)^(?:status:\s*active|review_status:\s*approved)\s*$',
                  base.stdout,
              ):
                  subprocess.run(['git', 'restore', '--source=HEAD', '--', name], check=True)
                  print(f'Preserved reviewed card: {name}')
                  continue
              text = path.read_text(encoding='utf-8')
              if not re.search(r'(?m)^review_status:', text):
                  text = re.sub(r'(?m)^(status:\s*draft\s*)$', r'\1\nreview_status: pending', text, count=1)
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Create or update review pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/public-tour-drafts
          delete-branch: false
          commit-message: 'chore: collect public tour drafts'
          title: 'chore: review new public tour drafts'
          body: |
            Автоматически собранные карточки отелей из публичных Telegram-каналов.

            Активные или одобренные карточки не изменяются импортом. Новые черновики помечены `review_status: pending`.
            После проверки смените `status: draft` на `status: active`, добавьте `review_status: approved` и `reviewed_at: YYYY-MM-DD`.
          draft: true
