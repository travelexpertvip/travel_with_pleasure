name: Normalize tour YAML

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tour-content-write
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize tour frontmatter
        run: python scripts/normalize_tour_frontmatter.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.vitepress/content/tours/*.md
          if git diff --cached --quiet; then
            echo 'No YAML changes to commit'
            exit 0
          fi
          git commit -m 'fix: normalize tour YAML'
          git pull --rebase origin main
          git push origin HEAD:main
