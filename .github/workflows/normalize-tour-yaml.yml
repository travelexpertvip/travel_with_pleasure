name: Normalize tour YAML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize tour frontmatter
        run: python scripts/normalize_tour_frontmatter.py
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.vitepress/content/tours/*.md
          if git diff --cached --quiet; then
            echo 'No YAML changes to commit'
            exit 0
          fi
          git commit -m 'fix: normalize tour YAML'
          git push
